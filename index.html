<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Cut NYC (Online v3.3)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-body: #f3f4f6; --bg-sidebar: #ffffff; --bg-card: #ffffff;
      --text: #111827; --muted: #6b7280; --border: #e5e7eb; --primary: #2563eb;
      --hover: #f9fafb; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      --green: #22c55e; --red: #ef4444;
    }
    [data-theme="dark"] {
      --bg-body: #000000; --bg-sidebar: #121212; --bg-card: #18181b;
      --text: #f4f4f5; --muted: #a1a1aa; --border: #27272a; --primary: #3b82f6;
      --hover: #27272a; --shadow: none;
    }
    * { box-sizing: border-box; outline: none; }
    body {
      margin: 0; font-family: 'Inter', sans-serif;
      background: var(--bg-body); color: var(--text);
      display: flex; height: 100vh; overflow: hidden;
    }
    
    /* SIDEBAR */
    .sidebar { width: 250px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; }
    .nav-item { padding: 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
    .nav-item:hover { background: var(--hover); color: var(--text); }
    .nav-item.active { background: var(--primary); color: white; }
    
    /* MAIN */
    .main { flex: 1; overflow-y: auto; padding: 30px; }
    .page { display: none; max-width: 700px; margin: 0 auto; }
    .page.active { display: block; }
    
    /* COMPONENTS */
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .btn { background: var(--text); color: var(--bg-card); border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn.danger { background: var(--red); color: white; }
    .btn.small { padding: 5px 10px; font-size: 12px; }
    
    /* FIX FOR INPUTS */
    input, textarea, select {
      width: 100%; padding: 10px;
      background: var(--bg-body); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; margin-bottom: 10px;
      font-family: inherit; box-sizing: border-box;
    }

    /* SPECIFIC LISTS */
    .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    #map { height: 400px; width: 100%; border-radius: 8px; z-index: 1; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); }
    .tx-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .tx-in { color: var(--green); } .tx-out { color: var(--red); }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- AUTH -->
  <div id="loginScreen" style="position:fixed; inset:0; background:var(--bg-body); z-index:999; display:flex; align-items:center; justify-content:center;">
    <div class="card" style="width:300px; text-align:center;">
      <h1>The Cut NYC</h1>
      <p style="color:var(--muted); font-size:14px;">Online Mode</p>
      <input id="loginUser" placeholder="Enter Username">
      <button class="btn" style="width:100%" onclick="login()">Connect</button>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden" style="display:flex; width:100%; height:100%;">
    <aside class="sidebar">
      <div style="font-weight:800; font-size:20px; margin-bottom:30px;">The Cut NYC</div>
      <nav>
        <div class="nav-item active" onclick="nav('feed')">Feed</div>
        <div class="nav-item" onclick="nav('profiles')">Profiles</div>
        <div class="nav-item" onclick="nav('jobs')">Jobs</div>
        <div class="nav-item" onclick="nav('events')">Events</div>
        <div class="nav-item" onclick="nav('wallet')">Wallet</div>
        <div class="nav-item" onclick="nav('map')">Map</div>
        <div class="nav-item" onclick="nav('account')">Account</div>
      </nav>
      <div style="margin-top:auto;">
        <button class="btn" style="width:100%; background:transparent; border:1px solid var(--border); color:var(--text);" onclick="toggleTheme()">Theme</button>
        <button class="btn danger" style="width:100%; margin-top:10px;" onclick="logout()">Logout</button>
      </div>
    </aside>

    <main class="main">
      
      <!-- FEED -->
      <div id="feed" class="page active">
        <h1>City Feed</h1>
        <div class="card">
          <textarea id="postText" rows="3" placeholder="What's happening?"></textarea>
          <div style="display:flex; gap:10px; margin-top:10px; align-items:center;">
            <input type="file" id="postFile" accept="image/*" style="width:auto; flex:1; margin:0;">
            <button class="btn" id="postBtn" onclick="addPost()">Post</button>
          </div>
        </div>
        <div id="feedList"></div>
      </div>

      <!-- PROFILES -->
      <div id="profiles" class="page">
        <h1>Citizens</h1>
        <div id="profileGrid" class="profile-grid"></div>
      </div>

      <!-- JOBS -->
      <div id="jobs" class="page">
        <h1>Job Board</h1>
        <div class="card">
          <h2>Post a Job</h2>
          <input id="jobTitle" placeholder="Job Title">
          <textarea id="jobDesc" rows="2" placeholder="Description"></textarea>
          <div style="display:flex; gap:10px;">
            <input id="jobPay" placeholder="Payment ($)">
            <button class="btn" onclick="addJob()">List Job</button>
          </div>
        </div>
        <div id="jobList"></div>
      </div>

      <!-- EVENTS -->
      <div id="events" class="page">
        <h1>Events</h1>
        <div class="card">
          <h2>Host Event</h2>
          <input id="evtTitle" placeholder="Event Name">
          <input id="evtLoc" placeholder="Location">
          <input id="evtTime" type="datetime-local">
          <button class="btn" onclick="addEvent()">Create Event</button>
        </div>
        <div id="eventList"></div>
      </div>

      <!-- PROFILE VIEW -->
      <div id="profileView" class="page">
        <button class="btn" style="margin-bottom:20px; font-size:12px;" onclick="nav('profiles')">← Back</button>
        <div class="card">
          <div style="display:flex; gap:20px; align-items:center;">
            <img id="pvAvatar" style="width:80px; height:80px; border-radius:50%; object-fit:cover; background:#333;">
            <div><h1 id="pvName" style="margin:0"></h1><div id="pvReal" style="color:var(--muted)"></div></div>
          </div>
          <div style="display:flex; gap:30px; margin:20px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:15px 0;">
            <div><strong>Age</strong><br><span id="pvAge">-</span></div>
            <div><strong>Occ</strong><br><span id="pvOcc">-</span></div>
            <div><strong>Status</strong><br><span id="pvStat">-</span></div>
          </div>
          <p id="pvBio" style="white-space:pre-wrap; color:var(--muted);"></p>
          <div style="font-size:13px; color:var(--muted); margin-top:20px;">📍 <span id="pvLoc"></span></div>
        </div>
      </div>

      <!-- WALLET -->
      <div id="wallet" class="page">
        <h1>Wallet</h1>
        <div class="card" style="text-align:center; padding:40px;">
          <div style="font-size:14px; color:var(--muted)">CURRENT BALANCE</div>
          <div style="font-size:48px; font-weight:800; color:var(--primary);">$<span id="myBal">0</span></div>
        </div>
        <div class="card">
          <h2>Send Money</h2>
          <div style="display:flex; gap:10px;">
            <input id="payTo" placeholder="Username" style="flex:2">
            <input id="payAmt" type="number" placeholder="Amount" style="flex:1">
          </div>
          <button class="btn" onclick="transfer()">Send</button>
        </div>
        
        <!-- TRANSACTION LIST -->
        <h2 style="margin-top:30px">History</h2>
        <div id="txList" class="card" style="padding:0"></div>

        <div class="card" style="margin-top:20px">
          <h2>Manual Adjustment (Admin)</h2>
          <div style="display:flex; gap:10px;">
            <input id="adminAmt" type="number" placeholder="Amount">
            <button class="btn" onclick="modBalance(1)">Add +</button>
            <button class="btn danger" onclick="modBalance(-1)">Remove -</button>
          </div>
        </div>
      </div>

      <!-- MAP -->
      <div id="mapPage" class="page">
        <h1>City Map</h1>
        <div class="card" style="display:flex; align-items:center; justify-content:space-between;">
          <input id="pinTitle" placeholder="Pin Title" style="margin:0; width:60%;">
          <button id="armMapBtn" class="btn" onclick="toggleMapArm()">Add Pin</button>
        </div>
        <div id="map"></div>
        <h2 style="margin-top:20px;">Locations List</h2>
        <div id="pinList" class="card" style="padding:0;"></div>
      </div>

      <!-- ACCOUNT -->
      <div id="account" class="page">
        <h1>My Character</h1>
        <div class="card">
          <h2>Identity</h2>
          <label>Avatar URL</label><input id="editAvatar">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div><label>Real Name</label><input id="editReal"></div>
            <div><label>Age</label><input id="editAge" type="number"></div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div><label>Occupation</label><input id="editOcc"></div>
            <div><label>Status</label>
              <select id="editStatus">
                <option value="Single">Single</option>
                <option value="Taken">Taken</option>
                <option value="Complicated">Complicated</option>
                <option value="Married">Married</option>
              </select>
            </div>
          </div>
          <label>Location</label><input id="editLoc">
          <label>Bio</label><textarea id="editBio" rows="6"></textarea>
          <button class="btn" onclick="saveProfile()">Save Character</button>
        </div>
      </div>

    </main>
  </div>

<script>
// ==========================================
// PASTE KEYS HERE
// ==========================================
const SUPABASE_URL = 'https://virppeuknikpgmtgthnh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpcnBwZXVrbmlrcGdtdGd0aG5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MjA0ODksImV4cCI6MjA4NTE5NjQ4OX0.Klc3IcZEjp1dI1fLwkqSKVw9n5VfPPREsxkQhRcP0a0';

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let me = localStorage.getItem('cut_user_online') || null;
let mapObj = null, mapArmed = false;

// INIT
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme')||'light');
if(me) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('app').style.display = 'flex';
  loadAll();
}

function toggleTheme() {
  const n = document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme', n);
  localStorage.setItem('theme', n);
}

function nav(id) {
  document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
  document.getElementById(id==='map'?'mapPage':id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
  event.target.classList.add('active');
  if(id==='map') setTimeout(initMap,200);
}

function logout() { localStorage.removeItem('cut_user_online'); location.reload(); }

// --- AUTH & DATA ---
async function login() {
  const u = document.getElementById('loginUser').value.trim();
  if(!u) return;
  const { data } = await client.from('profiles').select().eq('username', u).single();
  if(!data) await client.from('profiles').insert({ username: u, balance: 100 });
  me = u;
  localStorage.setItem('cut_user_online', me);
  location.reload();
}

async function loadAll() {
  loadFeed();
  loadProfiles();
  loadJobs();
  loadEvents();
  loadMyProfile();
  loadTx();
}

// --- FEED ---
async function addPost() {
  const txt = document.getElementById('postText').value;
  const file = document.getElementById('postFile').files[0];
  const btn = document.getElementById('postBtn');
  if(!txt && !file) return;
  
  btn.innerText = '...';
  let url = null;
  if(file) {
    // Sanitize filename to prevent upload errors
    const cleanName = file.name.replace(/[^a-zA-Z0-9.]/g, '_');
    const name = `${Date.now()}_${cleanName}`;
    await client.storage.from('uploads').upload(name, file);
    const { data } = client.storage.from('uploads').getPublicUrl(name);
    url = data.publicUrl;
  }
  
  await client.from('posts').insert({ author: me, text: txt, img_url: url });
  document.getElementById('postText').value = '';
  document.getElementById('postFile').value = '';
  btn.innerText = 'Post';
  loadFeed();
}

async function loadFeed() {
  const { data } = await client.from('posts').select().order('created_at', {ascending:false}).limit(20);
  if(!data) return;
  document.getElementById('feedList').innerHTML = data.map(p => `
    <div class="card">
      <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--muted)">
        <strong onclick="openProfile('${p.author}')" style="cursor:pointer">@${p.author}</strong>
        <span>${new Date(p.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
      </div>
      <div style="margin-top:5px;">${p.text||''}</div>
      ${p.img_url ? `<img src="${p.img_url}" style="max-width:100%; margin-top:10px; border-radius:8px;">` : ''}
    </div>
  `).join('');
}

// --- PROFILES ---
async function loadProfiles() {
  const { data } = await client.from('profiles').select();
  if(!data) return;
  document.getElementById('profileGrid').innerHTML = data.map(u => `
    <div class="card" style="text-align:center; cursor:pointer;" onclick="openProfile('${u.username}')">
      <img src="${u.avatar||'https://ui-avatars.com/api/?name='+u.username}" style="width:60px; height:60px; border-radius:50%; object-fit:cover;">
      <div style="font-weight:bold; margin-top:5px;">@${u.username}</div>
      <div style="font-size:12px; color:var(--muted)">${u.occupation||'Citizen'}</div>
    </div>
  `).join('');
}

async function openProfile(u) {
  nav('profileView');
  const { data } = await client.from('profiles').select().eq('username', u).single();
  document.getElementById('pvName').innerText = '@'+data.username;
  document.getElementById('pvAvatar').src = data.avatar || 'https://ui-avatars.com/api/?name='+data.username;
  document.getElementById('pvReal').innerText = data.real_name || 'Unknown';
  document.getElementById('pvAge').innerText = data.age || '?';
  document.getElementById('pvOcc').innerText = data.occupation || '-';
  document.getElementById('pvStat').innerText = data.status || '-';
  document.getElementById('pvLoc').innerText = data.location || 'Unknown';
  document.getElementById('pvBio').innerText = data.bio || '';
}

async function loadMyProfile() {
  const { data } = await client.from('profiles').select().eq('username', me).single();
  if(!data) return;
  document.getElementById('editAvatar').value = data.avatar||'';
  document.getElementById('editReal').value = data.real_name||'';
  document.getElementById('editAge').value = data.age||'';
  document.getElementById('editOcc').value = data.occupation||'';
  document.getElementById('editStatus').value = data.status||'Single';
  document.getElementById('editLoc').value = data.location||'';
  document.getElementById('editBio').value = data.bio||'';
  document.getElementById('myBal').innerText = data.balance;
}

async function saveProfile() {
  await client.from('profiles').update({
    avatar: document.getElementById('editAvatar').value,
    real_name: document.getElementById('editReal').value,
    age: document.getElementById('editAge').value,
    occupation: document.getElementById('editOcc').value,
    status: document.getElementById('editStatus').value,
    location: document.getElementById('editLoc').value,
    bio: document.getElementById('editBio').value
  }).eq('username', me);
  alert('Saved!');
}

// --- JOBS & EVENTS ---
async function addJob() {
  await client.from('jobs').insert({
    author: me, title: document.getElementById('jobTitle').value,
    description: document.getElementById('jobDesc').value,
    pay: document.getElementById('jobPay').value
  });
  loadJobs();
}
async function loadJobs() {
  const { data } = await client.from('jobs').select().order('created_at', {ascending:false});
  document.getElementById('jobList').innerHTML = (data||[]).map(j => `
    <div class="card">
      <div style="display:flex; justify-content:space-between;">
        <b>${j.title}</b>
        ${j.author === me ? `<button class="btn danger small" onclick="delJob(${j.id})">Delete</button>` : ''}
      </div>
      <span style="color:green">(${j.pay})</span>
      <p>${j.description}</p>
      <small>@${j.author}</small>
    </div>
  `).join('');
}
async function delJob(id) {
    if(confirm('Delete job?')) {
        await client.from('jobs').delete().eq('id', id);
        loadJobs();
    }
}

async function addEvent() {
  await client.from('events').insert({
    author: me, title: document.getElementById('evtTitle').value,
    location: document.getElementById('evtLoc').value,
    event_date: document.getElementById('evtTime').value
  });
  loadEvents();
}
async function loadEvents() {
  const { data } = await client.from('events').select().order('created_at', {ascending:false});
  document.getElementById('eventList').innerHTML = (data||[]).map(e => `
    <div class="card">
      <div style="display:flex; justify-content:space-between;">
        <b>${e.title}</b>
        ${e.author === me ? `<button class="btn danger small" onclick="delEvt(${e.id})">Delete</button>` : ''}
      </div>
      <br>📍 ${e.location}<br>
      <small>${new Date(e.event_date).toLocaleString()}</small>
    </div>
  `).join('');
}
async function delEvt(id) {
    if(confirm('Delete event?')) {
        await client.from('events').delete().eq('id', id);
        loadEvents();
    }
}

// --- WALLET & TRANSACTIONS ---
async function transfer() {
  const to = document.getElementById('payTo').value;
  const amt = parseInt(document.getElementById('payAmt').value);
  const { data: my } = await client.from('profiles').select('balance').eq('username', me).single();
  if(my.balance < amt) return alert('Not enough money');
  const { data: dest } = await client.from('profiles').select('balance').eq('username', to).single();
  if(!dest) return alert('User not found');
  
  // Update Balances
  await client.from('profiles').update({ balance: my.balance - amt }).eq('username', me);
  await client.from('profiles').update({ balance: dest.balance + amt }).eq('username', to);
  
  // Record Transaction
  await client.from('transactions').insert({ from_user: me, to_user: to, amount: amt });
  
  alert('Sent!'); 
  loadMyProfile();
  loadTx();
}

async function loadTx() {
    const { data } = await client.from('transactions').select().or(`from_user.eq.${me},to_user.eq.${me}`).order('created_at', {ascending:false});
    
    document.getElementById('txList').innerHTML = (data||[]).map(t => {
        const isIn = t.to_user === me;
        return `
        <div class="tx-item">
            <div>${isIn ? 'Received from' : 'Sent to'} <strong>${isIn ? t.from_user : t.to_user}</strong></div>
            <div class="${isIn ? 'tx-in' : 'tx-out'}">${isIn ? '+' : '-'}${t.amount}</div>
        </div>`;
    }).join('');
}

async function modBalance(m) {
  const amt = parseInt(document.getElementById('adminAmt').value);
  const { data } = await client.from('profiles').select('balance').eq('username', me).single();
  await client.from('profiles').update({ balance: data.balance + (amt*m) }).eq('username', me);
  loadMyProfile();
}

// --- MAP ---
function initMap() {
  if(mapObj) { mapObj.invalidateSize(); return; }
  mapObj = L.map('map').setView([40.7128, -74.0060], 13);
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  L.tileLayer(isDark ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' : 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(mapObj);
  
  loadPins();
  mapObj.on('click', async (e) => {
    if(mapArmed) {
      await client.from('pins').insert({ owner: me, lat: e.latlng.lat, lng: e.latlng.lng, title: document.getElementById('pinTitle').value||'Pin' });
      mapArmed = false; document.getElementById('armMapBtn').style.background = '';
      loadPins();
    }
  });
}

async function loadPins() {
  const { data } = await client.from('pins').select();
  if(!data) return;
  // Map
  mapObj.eachLayer(l => { if(l instanceof L.Marker) mapObj.removeLayer(l); });
  data.forEach(p => L.marker([p.lat, p.lng]).addTo(mapObj).bindPopup(`<b>${p.title}</b><br>@${p.owner}`));
  
  // List
  document.getElementById('pinList').innerHTML = data.map(p => `
    <div class="list-item">
      <div><b>${p.title}</b> <small>@${p.owner}</small></div>
      ${p.owner===me ? `<button class="btn danger small" onclick="delPin(${p.id})">Del</button>` : ''}
    </div>
  `).join('');
}

async function delPin(id) {
  if(!confirm('Delete?')) return;
  await client.from('pins').delete().eq('id', id);
  loadPins();
}

function toggleMapArm() {
  mapArmed = !mapArmed;
  document.getElementById('armMapBtn').style.background = mapArmed ? '#22c55e' : '';
}

</script>
</body>
</html>
