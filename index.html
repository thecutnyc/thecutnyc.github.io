<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Cut NYC (Online)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- SUPABASE JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-body: #f3f4f6; --bg-sidebar: #ffffff; --bg-card: #ffffff;
      --text: #111827; --muted: #6b7280; --border: #e5e7eb; --primary: #2563eb;
    }
    [data-theme="dark"] {
      --bg-body: #000000; --bg-sidebar: #121212; --bg-card: #18181b;
      --text: #f4f4f5; --muted: #a1a1aa; --border: #27272a; --primary: #3b82f6;
    }
    body { margin:0; font-family:'Inter',sans-serif; background:var(--bg-body); color:var(--text); display:flex; height:100vh; overflow:hidden; }
    .sidebar { width:250px; background:var(--bg-sidebar); border-right:1px solid var(--border); padding:20px; display:flex; flex-direction:column; }
    .main { flex:1; overflow-y:auto; padding:20px; }
    .page { display:none; max-width:700px; margin:0 auto; }
    .page.active { display:block; }
    .card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }
    .btn { background:var(--text); color:var(--bg-card); padding:10px 16px; border-radius:6px; cursor:pointer; border:none; font-weight:600; }
    .btn.danger { background:#ef4444; color:white; }
    input, textarea, select { width:100%; padding:10px; background:var(--bg-body); border:1px solid var(--border); color:var(--text); border-radius:6px; margin-bottom:10px; }
    .nav-item { padding:12px; cursor:pointer; color:var(--muted); border-radius:8px; margin-bottom:4px; font-weight:600; }
    .nav-item:hover { background:var(--bg-body); color:var(--text); }
    .nav-item.active { background:var(--primary); color:white; }
    #map { height:400px; width:100%; border-radius:8px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>

<!-- AUTH -->
<div id="loginScreen" style="position:fixed; inset:0; background:var(--bg-body); z-index:999; display:flex; align-items:center; justify-content:center;">
  <div class="card" style="width:300px; text-align:center;">
    <h1>The Cut NYC</h1>
    <p style="color:var(--muted); font-size:14px; margin-bottom:20px;">Online Multiplayer Mode</p>
    <input id="loginUser" placeholder="Enter Username">
    <button class="btn" style="width:100%" onclick="login()">Connect</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden" style="display:flex; width:100%; height:100%;">
  <aside class="sidebar">
    <div style="font-weight:800; font-size:20px; margin-bottom:30px;">The Cut NYC</div>
    <nav>
      <div class="nav-item active" onclick="nav('feed')">Feed</div>
      <div class="nav-item" onclick="nav('profiles')">Profiles</div>
      <div class="nav-item" onclick="nav('jobs')">Jobs</div>
      <div class="nav-item" onclick="nav('events')">Events</div>
      <div class="nav-item" onclick="nav('wallet')">Wallet</div>
      <div class="nav-item" onclick="nav('map')">Map</div>
      <div class="nav-item" onclick="nav('account')">Account</div>
    </nav>
    <div style="margin-top:auto;">
      <button class="btn" style="width:100%; background:transparent; border:1px solid var(--border); color:var(--text);" onclick="toggleTheme()">Theme</button>
    </div>
  </aside>

  <main class="main">
    
    <!-- FEED -->
    <div id="feed" class="page active">
      <h1>City Feed</h1>
      <div class="card">
        <textarea id="postText" rows="2" placeholder="What's happening?"></textarea>
        <div style="display:flex; gap:10px; margin-top:10px;">
          <input type="file" id="postFile" accept="image/*">
          <button class="btn" onclick="addPost()" id="postBtn">Post</button>
        </div>
      </div>
      <div id="feedList"></div>
    </div>

    <!-- PROFILES -->
    <div id="profiles" class="page">
      <h1>Citizens</h1>
      <div id="profileGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:15px;"></div>
    </div>

    <!-- PROFILE VIEW -->
    <div id="profileView" class="page">
      <button class="btn" onclick="nav('profiles')" style="margin-bottom:20px; font-size:12px;">← Back</button>
      <div class="card">
        <div style="display:flex; gap:20px; align-items:center;">
          <img id="pvAvatar" style="width:80px; height:80px; border-radius:50%; object-fit:cover; background:#333;">
          <div><h1 id="pvName" style="margin:0"></h1><div id="pvOcc" style="color:var(--muted)"></div></div>
        </div>
        <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
        <p id="pvBio" style="white-space:pre-wrap; color:var(--muted);"></p>
        <div style="display:flex; gap:20px; margin-top:20px; font-weight:bold;">
          <div>Age: <span id="pvAge" style="font-weight:400"></span></div>
          <div>Status: <span id="pvStat" style="font-weight:400"></span></div>
          <div>Loc: <span id="pvLoc" style="font-weight:400"></span></div>
        </div>
      </div>
    </div>

    <!-- JOBS & EVENTS -->
    <div id="jobs" class="page">
      <h1>Jobs</h1>
      <div class="card">
        <input id="jobTitle" placeholder="Title">
        <input id="jobPay" placeholder="Pay">
        <button class="btn" onclick="addJob()">Post Job</button>
      </div>
      <div id="jobList"></div>
    </div>

    <div id="events" class="page">
      <h1>Events</h1>
      <div class="card">
        <input id="evtTitle" placeholder="Event Name">
        <input id="evtLoc" placeholder="Location">
        <input id="evtDate" type="datetime-local">
        <button class="btn" onclick="addEvent()">Post Event</button>
      </div>
      <div id="evtList"></div>
    </div>

    <!-- WALLET -->
    <div id="wallet" class="page">
      <h1>Wallet</h1>
      <div class="card" style="text-align:center;">
        <div style="font-size:40px; font-weight:800; color:var(--primary);">$<span id="myBal">...</span></div>
      </div>
      <div class="card">
        <h3>Transfer</h3>
        <input id="payTo" placeholder="Username">
        <input id="payAmt" type="number" placeholder="Amount">
        <button class="btn" onclick="transfer()">Send Money</button>
      </div>
    </div>

    <!-- MAP -->
    <div id="mapPage" class="page">
      <h1>City Map</h1>
      <div class="card" style="display:flex; gap:10px;">
        <input id="pinTitle" placeholder="Pin Title">
        <button id="armMapBtn" class="btn" onclick="toggleMap()">Add Pin</button>
      </div>
      <div id="map"></div>
    </div>

    <!-- ACCOUNT -->
    <div id="account" class="page">
      <h1>My Character</h1>
      <div class="card">
        <label>Avatar URL</label><input id="myAvi">
        <label>Real Name</label><input id="myReal">
        <label>Occupation</label><input id="myOcc">
        <label>Bio</label><textarea id="myBio"></textarea>
        <button class="btn" onclick="saveProfile()">Save Changes</button>
      </div>
    </div>

  </main>
</div>

<script>
// ==========================================
// SETUP: PASTE YOUR SUPABASE KEYS BELOW
// ==========================================
const SUPABASE_URL = 'https://virppeuknikpgmtgthnh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpcnBwZXVrbmlrcGdtdGd0aG5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MjA0ODksImV4cCI6MjA4NTE5NjQ4OX0.Klc3IcZEjp1dI1fLwkqSKVw9n5VfPPREsxkQhRcP0a0';

// FIXED: Using 'client' to avoid variable name conflict
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let me = localStorage.getItem('cut_user') || null;
let mapObj = null, mapArmed = false;

// THEME
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme')||'light');
function toggleTheme(){
  const n = document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme', n);
  localStorage.setItem('theme', n);
}

// LOGIN
async function login() {
  const u = document.getElementById('loginUser').value.trim();
  if(!u) return;
  
  // FIXED: Using 'client' instead of 'supabase'
  let { data } = await client.from('profiles').select().eq('username', u);
  if(!data || data.length === 0) {
    await client.from('profiles').insert({ username: u });
  }
  
  me = u;
  localStorage.setItem('cut_user', me);
  location.reload();
}

// APP START
if(me) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('app').style.display = 'flex';
  loadAll();
}

async function loadAll() {
  loadFeed();
  loadProfiles();
  loadJobs();
  loadEvents();
  loadMyProfile();
}

function nav(id) {
  document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
  document.getElementById(id==='map'?'mapPage':id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
  event.target.classList.add('active');
  if(id==='map') setTimeout(initMap,200);
}

// --- FEED & UPLOAD ---
async function addPost() {
  const txt = document.getElementById('postText').value;
  const file = document.getElementById('postFile').files[0];
  const btn = document.getElementById('postBtn');
  
  if(!txt && !file) return;
  btn.innerText = 'Posting...';

  let imgUrl = null;
  if(file) {
    const name = `${Date.now()}_${file.name}`;
    const { data, error } = await client.storage.from('uploads').upload(name, file);
    if(data) {
      const { data: pub } = client.storage.from('uploads').getPublicUrl(name);
      imgUrl = pub.publicUrl;
    }
  }

  await client.from('posts').insert({ author: me, text: txt, img_url: imgUrl });
  document.getElementById('postText').value = '';
  document.getElementById('postFile').value = '';
  btn.innerText = 'Post';
  loadFeed();
}

async function loadFeed() {
  const { data } = await client.from('posts').select().order('created_at', {ascending:false}).limit(20);
  if(!data) return;
  document.getElementById('feedList').innerHTML = data.map(p => `
    <div class="card">
      <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--muted)">
        <strong>@${p.author}</strong>
        <span>${new Date(p.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
      </div>
      <div style="margin-top:5px;">${p.text || ''}</div>
      ${p.img_url ? `<img src="${p.img_url}" style="max-width:100%; margin-top:10px; border-radius:8px;">` : ''}
    </div>
  `).join('');
}

// --- PROFILES ---
async function loadProfiles() {
  const { data } = await client.from('profiles').select();
  if(!data) return;
  document.getElementById('profileGrid').innerHTML = data.map(u => `
    <div class="card" style="text-align:center; cursor:pointer;" onclick="openProfile('${u.username}')">
      <img src="${u.avatar||'https://ui-avatars.com/api/?name='+u.username}" style="width:60px; height:60px; border-radius:50%; object-fit:cover;">
      <div style="font-weight:bold; margin-top:10px;">@${u.username}</div>
      <div style="font-size:12px; color:var(--muted)">${u.occupation||'Citizen'}</div>
    </div>
  `).join('');
}

async function openProfile(uName) {
  nav('profileView'); 
  const { data } = await client.from('profiles').select().eq('username', uName).single();
  if(!data) return;
  document.getElementById('pvName').innerText = '@'+data.username;
  document.getElementById('pvAvatar').src = data.avatar || 'https://ui-avatars.com/api/?name='+data.username;
  document.getElementById('pvOcc').innerText = data.occupation || 'Unknown';
  document.getElementById('pvBio').innerText = data.bio || '';
  document.getElementById('pvAge').innerText = data.age || '?';
  document.getElementById('pvStat').innerText = data.status || '-';
  document.getElementById('pvLoc').innerText = data.location || '-';
}

async function loadMyProfile() {
  const { data } = await client.from('profiles').select().eq('username', me).single();
  if(!data) return;
  document.getElementById('myAvi').value = data.avatar || '';
  document.getElementById('myReal').value = data.real_name || '';
  document.getElementById('myOcc').value = data.occupation || '';
  document.getElementById('myBio').value = data.bio || '';
  document.getElementById('myBal').innerText = data.balance;
}

async function saveProfile() {
  await client.from('profiles').update({
    avatar: document.getElementById('myAvi').value,
    real_name: document.getElementById('myReal').value,
    occupation: document.getElementById('myOcc').value,
    bio: document.getElementById('myBio').value
  }).eq('username', me);
  alert('Saved!');
}

// --- JOBS & EVENTS ---
async function addJob() {
  await client.from('jobs').insert({
    author: me,
    title: document.getElementById('jobTitle').value,
    pay: document.getElementById('jobPay').value
  });
  loadJobs();
}
async function loadJobs() {
  const { data } = await client.from('jobs').select().order('created_at', {ascending:false});
  if(!data) return;
  document.getElementById('jobList').innerHTML = data.map(j => 
    `<div class="card"><b>${j.title}</b> (${j.pay})<br><small>by @${j.author}</small></div>`
  ).join('');
}

async function addEvent() {
  await client.from('events').insert({
    author: me,
    title: document.getElementById('evtTitle').value,
    location: document.getElementById('evtLoc').value,
    event_date: document.getElementById('evtDate').value
  });
  loadEvents();
}
async function loadEvents() {
  const { data } = await client.from('events').select().order('created_at', {ascending:false});
  if(!data) return;
  document.getElementById('evtList').innerHTML = data.map(e => 
    `<div class="card"><b>${e.title}</b><br>📍 ${e.location}<br><small>${new Date(e.event_date).toLocaleString()}</small></div>`
  ).join('');
}

// --- WALLET ---
async function transfer() {
  const to = document.getElementById('payTo').value;
  const amt = parseInt(document.getElementById('payAmt').value);
  
  // 1. Get my balance
  const { data: myData } = await client.from('profiles').select('balance').eq('username', me).single();
  if(myData.balance < amt) return alert('Too poor!');

  // 2. Get their balance
  const { data: theirData } = await client.from('profiles').select('balance').eq('username', to).single();
  if(!theirData) return alert('User not found');

  // 3. Update both
  await client.from('profiles').update({ balance: myData.balance - amt }).eq('username', me);
  await client.from('profiles').update({ balance: theirData.balance + amt }).eq('username', to);
  
  alert('Sent!');
  loadMyProfile();
}

// --- MAP ---
function initMap() {
  if(mapObj) { mapObj.invalidateSize(); return; }
  mapObj = L.map('map').setView([40.7128, -74.0060], 13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(mapObj);
  
  loadPins();
  
  mapObj.on('click', async (e) => {
    if(mapArmed) {
      const title = document.getElementById('pinTitle').value || 'Pin';
      await client.from('pins').insert({ owner: me, lat: e.latlng.lat, lng: e.latlng.lng, title: title });
      mapArmed = false; 
      document.getElementById('armMapBtn').style.background = '';
      loadPins();
    }
  });
}

async function loadPins() {
  mapObj.eachLayer(l => { if(l instanceof L.Marker) mapObj.removeLayer(l); });
  const { data } = await client.from('pins').select();
  if(!data) return;
  data.forEach(p => {
    L.marker([p.lat, p.lng]).addTo(mapObj).bindPopup(`<b>${p.title}</b><br>@${p.owner}`);
  });
}

function toggleMap() {
  mapArmed = !mapArmed;
  document.getElementById('armMapBtn').style.background = mapArmed ? '#22c55e' : '';
}

</script>
</body>
</html>
