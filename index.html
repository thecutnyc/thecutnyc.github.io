<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>the cut nyc</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="bar">
    <h1>the cut nyc</h1>
    <div class="right">
      <span id="whoami" class="muted"></span>
      <button id="logoutBtn" class="btn">Logout</button>
    </div>
  </header>

  <main class="wrap">
    <section id="authSection" class="card">
      <h2>Login</h2>
      <form id="loginForm" class="grid">
        <label>Email
          <input id="loginEmail" type="email" autocomplete="email" required />
        </label>
        <label>Password
          <input id="loginPassword" type="password" autocomplete="current-password" required />
        </label>
        <button class="btn primary" type="submit">Login</button>
      </form>
      <p id="authMsg" class="msg"></p>

      <hr />

      <h2>Create account</h2>
      <form id="signupForm" class="grid">
        <label>Email
          <input id="signupEmail" type="email" autocomplete="email" required />
        </label>
        <label>Password
          <input id="signupPassword" type="password" autocomplete="new-password" required />
        </label>
        <button class="btn" type="submit">Sign up</button>
      </form>
      <p id="signupMsg" class="msg"></p>
    </section>

    <section id="appSection" class="card hidden">
      <h2>New post</h2>
      <form id="postForm" class="grid">
        <label>Text
          <textarea id="postBody" rows="3" required></textarea>
        </label>
        <label>Image (optional)
          <input id="postImage" type="file" accept="image/*" />
        </label>
        <button class="btn primary" type="submit">Post</button>
      </form>
      <p id="postMsg" class="msg"></p>

      <hr />

      <h2>Feed</h2>
      <div id="feed"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
